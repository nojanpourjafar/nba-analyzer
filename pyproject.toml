[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-analyzer"
version = "0.1.0"
description = "NBA game win probabilities, measured honestly."
requires-python = ">=3.10"
dependencies = ["nba_api>=1.4", "pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]

[tool.setuptools]
packages = ["nba_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
